[package]
name = "synaptic-middleware"
description = "Middleware system for Synaptic agents: Interceptor trait and built-in interceptors"
edition.workspace = true
version.workspace = true
license.workspace = true
readme.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
synaptic-core = { version = "0.4", path = "../synaptic-core" }
synaptic-events = { version = "0.4", path = "../synaptic-events", optional = true }
tracing = { version = "0.1", optional = true }

[features]
condenser = ["dep:tracing"]
plugin = ["dep:synaptic-events", "dep:tracing"]

[dev-dependencies]
tokio.workspace = true
synaptic-macros = { workspace = true }

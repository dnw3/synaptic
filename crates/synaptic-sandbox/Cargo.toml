[package]
name = "synaptic-sandbox"
description = "Container sandbox for secure code execution — Docker and Apple Container backends"
edition.workspace = true
version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
synaptic-core = { version = "0.4", path = "../synaptic-core" }
async-trait.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "time"] }
tracing.workspace = true

[features]
default = ["docker"]
docker = []
apple-container = []

[dev-dependencies]
tokio.workspace = true

[package]
name = "synaptic"
description = "A Rust agent framework with LangChain-compatible architecture"
edition.workspace = true
version.workspace = true
license.workspace = true
readme.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
synaptic-core = { version = "0.4", path = "../synaptic-core" }
synaptic-models = { version = "0.4", path = "../synaptic-models", optional = true }
synaptic-openai = { version = "0.4", path = "../synaptic-openai", optional = true }
synaptic-anthropic = { version = "0.4", path = "../synaptic-anthropic", optional = true }
synaptic-gemini = { version = "0.4", path = "../synaptic-gemini", optional = true }
synaptic-ollama = { version = "0.4", path = "../synaptic-ollama", optional = true }
synaptic-runnables = { version = "0.4", path = "../synaptic-runnables", optional = true }
synaptic-prompts = { version = "0.4", path = "../synaptic-prompts", optional = true }
synaptic-parsers = { version = "0.4", path = "../synaptic-parsers", optional = true }
synaptic-tools = { version = "0.4", path = "../synaptic-tools", optional = true }
synaptic-memory = { version = "0.4", path = "../synaptic-memory", optional = true }
synaptic-callbacks = { version = "0.4", path = "../synaptic-callbacks", optional = true }
synaptic-retrieval = { version = "0.4", path = "../synaptic-retrieval", optional = true }
synaptic-loaders = { version = "0.4", path = "../synaptic-loaders", optional = true }
synaptic-splitters = { version = "0.4", path = "../synaptic-splitters", optional = true }
synaptic-embeddings = { version = "0.4", path = "../synaptic-embeddings", optional = true }
synaptic-vectorstores = { version = "0.4", path = "../synaptic-vectorstores", optional = true }
synaptic-graph = { version = "0.4", path = "../synaptic-graph", optional = true }
synaptic-middleware = { version = "0.4", path = "../synaptic-middleware", optional = true }
synaptic-store = { version = "0.4", path = "../synaptic-store", optional = true }
synaptic-cache = { version = "0.4", path = "../synaptic-cache", optional = true }
synaptic-eval = { version = "0.4", path = "../synaptic-eval", optional = true }
synaptic-mcp = { version = "0.4", path = "../synaptic-mcp", optional = true }
synaptic-macros = { version = "0.4", path = "../synaptic-macros", optional = true }
synaptic-deep = { version = "0.4", path = "../synaptic-deep", optional = true }
synaptic-condenser = { version = "0.4", path = "../synaptic-condenser", optional = true }
synaptic-secrets = { version = "0.4", path = "../synaptic-secrets", optional = true }
synaptic-config = { version = "0.4", path = "../synaptic-config", optional = true }
synaptic-session = { version = "0.4", path = "../synaptic-session", optional = true }
synaptic-qdrant = { version = "0.4", path = "../synaptic-qdrant", optional = true }
synaptic-postgres = { version = "0.4", path = "../synaptic-postgres", optional = true }
synaptic-redis = { version = "0.4", path = "../synaptic-redis", optional = true }
synaptic-pdf = { version = "0.4", path = "../synaptic-pdf", optional = true }
synaptic-bedrock = { version = "0.4", path = "../synaptic-bedrock", optional = true }
synaptic-cohere = { version = "0.4", path = "../synaptic-cohere", optional = true }
synaptic-pinecone = { version = "0.4", path = "../synaptic-pinecone", optional = true }
synaptic-chroma = { version = "0.4", path = "../synaptic-chroma", optional = true }
synaptic-mongodb = { version = "0.4", path = "../synaptic-mongodb", optional = true }
synaptic-elasticsearch = { version = "0.4", path = "../synaptic-elasticsearch", optional = true }
synaptic-sqlite = { version = "0.4", path = "../synaptic-sqlite", optional = true }
synaptic-tavily = { version = "0.4", path = "../synaptic-tavily", optional = true }
synaptic-huggingface = { version = "0.4", path = "../synaptic-huggingface", optional = true }
synaptic-voyage = { version = "0.4", path = "../synaptic-voyage", optional = true }
synaptic-nomic = { version = "0.4", path = "../synaptic-nomic", optional = true }
synaptic-jina = { version = "0.4", path = "../synaptic-jina", optional = true }
synaptic-weaviate = { version = "0.4", path = "../synaptic-weaviate", optional = true }
synaptic-sqltoolkit = { version = "0.4", path = "../synaptic-sqltoolkit", optional = true }
synaptic-e2b = { version = "0.4", path = "../synaptic-e2b", optional = true }
synaptic-milvus = { version = "0.4", path = "../synaptic-milvus", optional = true }
synaptic-opensearch = { version = "0.4", path = "../synaptic-opensearch", optional = true }
synaptic-lancedb = { version = "0.4", path = "../synaptic-lancedb", optional = true }
synaptic-confluence = { version = "0.4", path = "../synaptic-confluence", optional = true }
synaptic-slack = { version = "0.4", path = "../synaptic-slack", optional = true }
synaptic-langfuse = { version = "0.4", path = "../synaptic-langfuse", optional = true }
synaptic-flashrank = { version = "0.4", path = "../synaptic-flashrank", optional = true }
synaptic-lark = { version = "0.4", path = "../synaptic-lark", optional = true }
synaptic-voice = { version = "0.4", path = "../synaptic-voice", optional = true }
synaptic-browser = { version = "0.4", path = "../synaptic-browser", optional = true }
synaptic-scheduler = { version = "0.4", path = "../synaptic-scheduler", optional = true }
synaptic-sandbox = { version = "0.4", path = "../synaptic-sandbox", optional = true }
synaptic-metrics = { version = "0.4", path = "../synaptic-metrics", optional = true }
schemars = { workspace = true, optional = true }

[features]
default = ["runnables", "prompts", "parsers", "tools", "callbacks"]

# Infrastructure (provider-agnostic)
model-utils = ["dep:synaptic-models"]
runnables = ["dep:synaptic-runnables"]
prompts = ["runnables", "dep:synaptic-prompts"]
parsers = ["runnables", "dep:synaptic-parsers"]
tools = ["dep:synaptic-tools"]
memory = ["runnables", "dep:synaptic-memory"]
callbacks = ["dep:synaptic-callbacks"]
otel = ["callbacks", "synaptic-callbacks/otel"]
langfuse = ["dep:synaptic-langfuse"]
retrieval = ["embeddings", "dep:synaptic-retrieval"]
loaders = ["dep:synaptic-loaders"]
splitters = ["dep:synaptic-splitters"]
embeddings = ["dep:synaptic-embeddings"]
vectorstores = ["dep:synaptic-vectorstores"]
graph = ["tools", "dep:synaptic-graph"]
middleware = ["graph", "dep:synaptic-middleware"]
store = ["dep:synaptic-store"]
cache = ["dep:synaptic-cache"]
eval = ["embeddings", "dep:synaptic-eval"]
mcp = ["dep:synaptic-mcp"]
macros = ["dep:synaptic-macros"]
schemars = ["synaptic-macros/schemars", "synaptic-core/schemars", "dep:schemars"]
deep = ["agent", "dep:synaptic-deep"]
condenser = ["middleware", "dep:synaptic-condenser"]
secrets = ["middleware", "dep:synaptic-secrets"]
config = ["dep:synaptic-config"]
session = ["graph", "memory", "store", "dep:synaptic-session"]
store-filesystem = ["store", "synaptic-store/filesystem"]
deep-config = ["deep", "config", "openai", "synaptic-deep/config-builder"]

# Provider integrations (each pulls model-utils for Backend + wrappers)
openai = ["model-utils", "dep:synaptic-openai"]
anthropic = ["model-utils", "dep:synaptic-anthropic"]
gemini = ["model-utils", "dep:synaptic-gemini"]
ollama = ["model-utils", "dep:synaptic-ollama"]
bedrock = ["dep:synaptic-bedrock"]
cohere = ["dep:synaptic-cohere"]
qdrant = ["dep:synaptic-qdrant"]
postgres = ["dep:synaptic-postgres"]
redis = ["dep:synaptic-redis"]
redis-cluster = ["redis", "synaptic-redis/cluster"]
pdf = ["dep:synaptic-pdf"]
pinecone = ["dep:synaptic-pinecone"]
chroma = ["dep:synaptic-chroma"]
mongodb = ["dep:synaptic-mongodb"]
elasticsearch = ["dep:synaptic-elasticsearch"]
sqlite = ["dep:synaptic-sqlite"]
tavily = ["dep:synaptic-tavily"]
huggingface = ["dep:synaptic-huggingface"]
voyage = ["dep:synaptic-voyage"]
nomic = ["dep:synaptic-nomic"]
jina = ["dep:synaptic-jina"]
weaviate = ["dep:synaptic-weaviate"]
sqltoolkit = ["dep:synaptic-sqltoolkit"]
e2b = ["dep:synaptic-e2b"]
milvus = ["dep:synaptic-milvus"]
opensearch = ["dep:synaptic-opensearch"]
lancedb = ["dep:synaptic-lancedb"]
confluence = ["dep:synaptic-confluence"]
slack = ["dep:synaptic-slack"]
flashrank = ["dep:synaptic-flashrank"]
lark = ["dep:synaptic-lark"]
lark-bot = ["dep:synaptic-lark", "synaptic-lark/bot"]
voice = ["dep:synaptic-voice"]
browser = ["dep:synaptic-browser"]
scheduler = ["dep:synaptic-scheduler"]
sandbox = ["dep:synaptic-sandbox"]
metrics = ["callbacks", "dep:synaptic-metrics"]

# Convenience combinations
models = ["openai", "anthropic", "gemini", "ollama", "bedrock", "cohere"]
agent = ["default", "graph", "memory", "middleware", "store", "condenser", "secrets", "config", "session"]
rag = ["default", "embeddings", "retrieval", "loaders", "splitters", "vectorstores"]
agent-openai = ["agent", "openai"]
agent-anthropic = ["agent", "anthropic"]
agent-ollama = ["agent", "ollama"]
rag-openai = ["rag", "openai"]
rag-anthropic = ["rag", "anthropic"]
rag-ollama = ["rag", "ollama"]
full = ["default", "agent", "rag", "cache", "eval", "mcp", "macros", "deep", "schemars",
        "otel", "langfuse",
        "models", "qdrant", "postgres", "redis", "redis-cluster", "pdf",
        "pinecone", "chroma", "mongodb", "elasticsearch", "sqlite", "tavily",
        "huggingface", "voyage", "nomic", "jina", "weaviate", "sqltoolkit",
        "e2b", "confluence", "slack",
        "milvus", "opensearch", "lancedb", "flashrank", "lark",
        "store-filesystem", "deep-config",
        "voice", "browser", "scheduler",
        "sandbox", "metrics"]

[dev-dependencies]
tokio.workspace = true
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

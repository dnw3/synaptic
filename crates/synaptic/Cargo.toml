[package]
name = "synaptic"
description = "A Rust agent framework with LangChain-compatible architecture"
edition.workspace = true
version.workspace = true
license.workspace = true
readme.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
synaptic-core = { version = "0.4", path = "../synaptic-core" }
synaptic-models = { version = "0.4", path = "../synaptic-models", optional = true }
synaptic-rag = { version = "0.4", path = "../synaptic-rag", optional = true }
synaptic-tools = { version = "0.4", path = "../synaptic-tools", optional = true }
synaptic-memory = { version = "0.4", path = "../synaptic-memory", optional = true }
synaptic-graph = { version = "0.4", path = "../synaptic-graph", optional = true }
synaptic-middleware = { version = "0.4", path = "../synaptic-middleware", optional = true }
synaptic-store = { version = "0.4", path = "../synaptic-store", optional = true }
synaptic-mcp = { version = "0.4", path = "../synaptic-mcp", optional = true }
synaptic-macros = { version = "0.4", path = "../synaptic-macros", optional = true }
synaptic-deep = { version = "0.4", path = "../synaptic-deep", optional = true }
synaptic-config = { version = "0.4", path = "../synaptic-config", optional = true }
synaptic-integrations = { version = "0.4", path = "../synaptic-integrations", optional = true }
synaptic-events = { version = "0.4", path = "../synaptic-events", optional = true }
synaptic-lark = { version = "0.4", path = "../synaptic-lark", optional = true }
synaptic-logging = { version = "0.4", path = "../synaptic-logging", optional = true }
schemars = { workspace = true, optional = true }

[features]
default = ["runnables", "prompts", "parsers", "tools"]

# Infrastructure (provider-agnostic)
model-utils = ["dep:synaptic-models"]
runnables = []
prompts = ["dep:synaptic-rag", "synaptic-rag/prompts"]
parsers = ["dep:synaptic-rag", "synaptic-rag/parsers"]
tools = ["dep:synaptic-tools"]
memory = ["dep:synaptic-memory"]
viking = ["memory", "synaptic-memory/viking"]
langfuse = ["dep:synaptic-integrations", "synaptic-integrations/langfuse"]
retrieval = ["embeddings", "dep:synaptic-rag", "synaptic-rag/retrieval"]
loaders = ["dep:synaptic-rag", "synaptic-rag/loaders"]
splitters = ["dep:synaptic-rag", "synaptic-rag/splitters"]
embeddings = ["dep:synaptic-rag", "synaptic-rag/embeddings"]
vectorstores = ["dep:synaptic-rag", "synaptic-rag/vectorstores"]
graph = ["tools", "dep:synaptic-graph"]
middleware = ["graph", "dep:synaptic-middleware"]
events = ["dep:synaptic-events"]
plugin = ["events", "config", "middleware", "synaptic-config/plugin", "synaptic-middleware/plugin"]
store = ["dep:synaptic-store"]
cache = ["config", "synaptic-config/cache"]
eval = ["embeddings", "dep:synaptic-rag", "synaptic-rag/eval"]
mcp = ["dep:synaptic-mcp"]
macros = ["dep:synaptic-macros"]
schemars = ["synaptic-macros/schemars", "synaptic-core/schemars", "dep:schemars"]
deep = ["agent", "dep:synaptic-deep"]
deep-filesystem = ["deep", "synaptic-deep/filesystem"]
condenser = ["middleware", "synaptic-middleware/condenser"]
secrets = ["middleware", "config", "synaptic-config/secrets"]
config = ["dep:synaptic-config"]
session = ["graph", "memory", "store", "config", "synaptic-config/session"]
store-filesystem = ["store", "synaptic-store/filesystem"]
message-ir = ["synaptic-core/message-ir"]
deep-config = ["deep", "config", "openai", "synaptic-deep/config-builder"]
logging = ["dep:synaptic-logging"]
otel = ["events", "synaptic-events/otel"]

# Provider integrations — routed through collection crates
openai = ["model-utils", "dep:synaptic-models", "synaptic-models/openai"]
anthropic = ["model-utils", "dep:synaptic-models", "synaptic-models/anthropic"]
gemini = ["model-utils", "dep:synaptic-models", "synaptic-models/gemini"]
ollama = ["model-utils", "dep:synaptic-models", "synaptic-models/ollama"]
bedrock = ["model-utils", "dep:synaptic-models", "synaptic-models/bedrock"]
cohere = ["model-utils", "dep:synaptic-models", "synaptic-models/cohere"]

# Embedding providers — via synaptic-rag
huggingface = ["embeddings", "synaptic-rag/huggingface"]
voyage = ["embeddings", "synaptic-rag/voyage"]
nomic = ["embeddings", "synaptic-rag/nomic"]
jina = ["embeddings", "synaptic-rag/jina"]
flashrank = ["embeddings", "synaptic-rag/flashrank"]

# Vector store providers — via synaptic-rag
qdrant = ["vectorstores", "synaptic-rag/qdrant"]
pinecone = ["vectorstores", "synaptic-rag/pinecone"]
chroma = ["vectorstores", "synaptic-rag/chroma"]
weaviate = ["vectorstores", "synaptic-rag/weaviate"]
elasticsearch = ["vectorstores", "synaptic-rag/elasticsearch"]
opensearch = ["vectorstores", "synaptic-rag/opensearch"]
milvus = ["vectorstores", "synaptic-rag/milvus"]
lancedb = ["vectorstores", "synaptic-rag/lancedb"]

# Store backends — via synaptic-store
postgres = ["store", "synaptic-store/postgres"]
redis = ["store", "synaptic-store/redis"]
redis-cluster = ["redis", "synaptic-store/redis-cluster"]
sqlite = ["store", "synaptic-store/sqlite"]
mongodb = ["store", "synaptic-store/mongodb"]

# Tool extensions
pdf = ["tools", "synaptic-tools/pdf"]
sqltoolkit = ["tools", "synaptic-tools/sql"]
e2b = ["tools", "synaptic-tools/e2b"]
browser = ["tools", "synaptic-tools/browser"]
sandbox = ["tools", "synaptic-tools/sandbox", "synaptic-tools/sandbox-docker"]

# Integration features
tavily = ["dep:synaptic-integrations", "synaptic-integrations/tavily"]
confluence = ["dep:synaptic-integrations", "synaptic-integrations/confluence"]
slack = ["dep:synaptic-integrations", "synaptic-integrations/slack"]
voice = ["dep:synaptic-integrations", "synaptic-integrations/voice"]
voice-openai = ["voice", "synaptic-integrations/voice-openai"]
scheduler = ["dep:synaptic-integrations", "synaptic-integrations/scheduler"]
lark = ["dep:synaptic-lark"]
lark-bot = ["dep:synaptic-lark", "synaptic-lark/bot"]

# Convenience combinations
models = ["openai", "anthropic", "gemini", "ollama", "bedrock", "cohere"]
agent = ["default", "graph", "memory", "middleware", "events", "plugin", "store", "condenser", "secrets", "config", "session", "logging"]
rag = ["default", "embeddings", "retrieval", "loaders", "splitters", "vectorstores"]
agent-openai = ["agent", "openai"]
agent-anthropic = ["agent", "anthropic"]
agent-ollama = ["agent", "ollama"]
rag-openai = ["rag", "openai"]
rag-anthropic = ["rag", "anthropic"]
rag-ollama = ["rag", "ollama"]
full = ["default", "agent", "rag", "cache", "eval", "mcp", "macros", "deep", "schemars",
        "otel", "langfuse",
        "models", "qdrant", "postgres", "redis", "redis-cluster", "pdf",
        "pinecone", "chroma", "mongodb", "elasticsearch", "sqlite", "tavily",
        "huggingface", "voyage", "nomic", "jina", "weaviate", "sqltoolkit",
        "e2b", "confluence", "slack",
        "milvus", "opensearch", "lancedb", "flashrank", "lark",
        "store-filesystem", "deep-config",
        "voice", "browser", "scheduler",
        "sandbox", "viking"]

[dev-dependencies]
tokio.workspace = true
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[workspace]
members = [
  "crates/synaptic-core",
  "crates/synaptic-macros",
  "crates/synaptic-graph",
  "crates/synaptic-middleware",
  "crates/synaptic-events",
  "crates/synaptic-models",
  "crates/synaptic-store",
  "crates/synaptic-memory",
  "crates/synaptic-rag",
  "crates/synaptic-tools",
  "crates/synaptic-integrations",
  "crates/synaptic-deep",
  "crates/synaptic-lark",
  "crates/synaptic-mcp",
  "crates/synaptic-config",
  "crates/synaptic-logging",
  "crates/synaptic",
  "examples/react_basic",
  "examples/tool_calling_basic",
  "examples/memory_chat",
  "examples/graph_visualization",
  "examples/lcel_chain",
  "examples/prompt_parser_chain",
  "examples/streaming",
  "examples/rag_pipeline",
  "examples/memory_strategy",
  "examples/structured_output",
  "examples/evaluation",
  "examples/caching",
  "examples/macros_showcase",
  "examples/lark_rag",
  "examples/lark_streaming_bot",
  "examples/volcengine_test",
  "examples/condenser_demo",
  "examples/security_demo",
  "examples/secrets_demo",
  "examples/tool_filter_demo",
  "examples/config_agent",
  "examples/session_resume",
  "examples/file_persistence",
  "examples/token_budget_demo",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.4.0"
license = "MIT"
authors = ["Synaptic Contributors"]
rust-version = "1.88"
description = "A Rust agent framework with LangChain-compatible architecture"
repository = "https://github.com/dnw3/synaptic"
homepage = "https://dnw3.github.io/synaptic/"
readme = "README.md"
keywords = ["ai", "agent", "langchain", "llm", "rag"]
categories = ["science"]

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "sync", "time", "fs"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
reqwest = { version = "0.13", features = ["json", "stream", "query"] }
futures = "0.3"
async-stream = "0.3"
eventsource-stream = "0.2"
bytes = "1"
csv = "1.3"
regex = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
schemars = { version = "1", features = ["derive"] }
synaptic-core = { version = "0.4", path = "crates/synaptic-core" }
synaptic-mcp = { version = "0.4", path = "crates/synaptic-mcp" }
synaptic-macros = { version = "0.4", path = "crates/synaptic-macros" }
synaptic-middleware = { version = "0.4", path = "crates/synaptic-middleware" }
synaptic-deep = { version = "0.4", path = "crates/synaptic-deep" }
toml = "0.8"
serde_yml = "0.0.12"
dirs = "6"
sha2 = "0.10"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
